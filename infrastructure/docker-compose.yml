version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: neroute-postgres
    environment:
      POSTGRES_USER: neroute
      POSTGRES_PASSWORD: neroute_secure_password
      POSTGRES_DB: neroute_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neroute -d neroute_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neroute-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: neroute-api
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite+aiosqlite:///./neroute.db
      REDIS_URL: redis://redis:6379/0
      USE_IN_MEMORY_BROKER: "true"
      SECRET_KEY: "ne-route-production-sih-2026-mdoner-logistics"
      CORS_ORIGINS: "http://localhost:3000,http://web:3000"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: neroute-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads_data:
